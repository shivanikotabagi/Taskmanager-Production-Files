spring.application.name=taskmanager-backend
server.port=8080

# ── Database ──────────────────────────────────────────────────
# In Docker, SPRING_DATASOURCE_URL env var overrides this value.
# The mysql service name resolves inside the Docker network.
spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ───────────────────────────────────────────
# update = Hibernate keeps tables in sync without dropping data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────
# Override APP_JWT_SECRET via environment variable in production
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ── CORS ─────────────────────────────────────────────────────
# Set APP_CORS_ALLOWED_ORIGINS env var to your EC2 public IP/domain
# e.g.  APP_CORS_ALLOWED_ORIGINS=http://54.123.45.67
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://'http://34.226.199.223:8080'}

# ── Logging ───────────────────────────────────────────────────
logging.level.com.taskmanager=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
